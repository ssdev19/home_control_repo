---
lookup_options:
 "^profile::.*(_token|_encrypt|_hide|_password)$": 
  convert_to: 'Sensitive' 
profile::it::nsclient::nagios_password: 'ENC[PKCS7,]'
profile::it::nxlog::graylogip_hide: ENC[PKCS7,]
profile::it::nxlog::graylogport_hide: ENC[PKCS7,]
profile::it::grafana::ldaphost_hide: ENC[PKCS7,]
profile::it::grafana::basedns_hide: 'ENC[PKCS7,]'
profile::it::grafana::binddns_hide: 'ENC[PKCS7,]'
# node_encrypt::certificates::ca_server: "%{facts.fqdn}"
profile::it::nagios::content: |
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_status_codes: []
        method: GET
profile::it::nagios::servicecontent: |
  [Unit]
  Description=Blackbox Exporter
  Wants=network-online.target
  After=network-online.target

  [Service]
  User=blackbox_exporter
  Group=blackbox_exporter
  Type=simple
  ExecStart=/usr/local/bin/blackbox_exporter --config.file /etc/blackbox_exporter/blackbox.yml

  [Install]
  WantedBy=multi-user.target
