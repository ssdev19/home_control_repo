---
timezone::timezone: "America/Phoenix"
ssh::server_options:
  Port: 22
  Protocol: 2
#  AddressFamily: "inet"
  HostKey:
    - "/etc/ssh/ssh_host_rsa_key"
    - "/etc/ssh/ssh_host_ecdsa_key"
    - "/etc/ssh/ssh_host_ed25519_key"
  SyslogFacility: "AUTHPRIV"
  # LogLevel: "INFO"
  LoginGraceTime: 195
  PermitRootLogin: "yes"
  PubkeyAuthentication: "yes"
  AuthorizedKeysFile: ".ssh/authorized_keys"
  PasswordAuthentication: "yes"
  ChallengeResponseAuthentication: "no"
  GSSAPIAuthentication: "yes"
  GSSAPICleanupCredentials: "no"
  UsePAM: "yes"
  AllowTcpForwarding: "yes"
  X11Forwarding: "yes"
  X11UseLocalhost: "no"
  X11DisplayOffset: 10
  UsePrivilegeSeparation: "no"
  PrintMotd: "yes"
  TCPKeepAlive: "yes"
  KbdInteractiveAuthentication: "no"
  # ClientAliveInterval: 0
  # ClientAliveCountMax: 3
  Banner: "/etc/ssh/sshd_banner"
  AcceptEnv:
    - "LANG LC_CTYPE LC_NUMERIC LC_TIME LC_COLLATE LC_MONETARY LC_MESSAGES"
    - "LC_PAPER LC_NAME LC_ADDRESS LC_TELEPHONE LC_MEASUREMENT"
    - "LC_IDENTIFICATION LC_ALL LANGUAGE"
    - "XMODIFIERS"
  Subsystem: "sftp /usr/libexec/openssh/sftp-server"
#   XAuthLocation: "/usr/bin/xauth"
#   Subsystem: "sftp /usr/libexec/openssh/sftp-server"
#   KerberosAuthentication: "no"
#   AuthorizedKeysCommand: "/usr/bin/sss_ssh_authorizedkeys"
#   AuthorizedKeysCommandUser: "nobody"
# ssh::client_options:
#   GlobalKnownHostsFile: "/var/lib/sss/pubconf/known_hosts"
#   PubkeyAuthentication: "yes"
#   ProxyCommand: "/usr/bin/sss_ssh_knownhostsproxy -p %p %h"
##########################################################

accounts::user_list:
  shahram:
    groups:
      - 'wheel'
    password: "%{lookup('root_pwd')}"
    sshkeys:
      - "ssh-rsa  rsa-key-20190116"
  root:
    groups:
      - 'wheel'
# password hash: openssl passwd -6
    password: "%{lookup('root_pwd')}"
    sshkeys:
      - 'ssh-rsa  rsa-key-20190116'

  # shahramdel:
  #   groups:
  #     - 'wheel'
  #   password: ''
  #   ignore_password_if_empty: true

  remove_users: &remove_user
    ensure: "absent"
    managehome: true
    purge_user_home: true
  shahramdel:
    <<: *remove_user
# graylog
rsyslog::config::actions:
  graylogAWS:
    type: "omfwd"
    facility: "*.*"
    config:
      Target: "tu.lsst.org"
      Port: 5514
      Protocol: "udp"
postfix::mta: true
postfix::inet_protocols: "ipv4"
postfix::manage_root_alias: true
postfix::inet_interfaces: "localhost"
postfix::mydestination: "$myhostname, localhost.$mydomain, localhost"
postfix::relayhost: 'localhost'
postfix::root_mail_recipient: 'shahram@belldex.com'
postfix::configs:
puppet_agent::package_version: "6.26.0"
puppet_agent::collection: "puppet6"
puppet_agent::config:
  - {section: "agent", setting: "show_diff", value: "true"}
  - {section: "agent", setting: "report", value: "false"}
puppet::report: false
