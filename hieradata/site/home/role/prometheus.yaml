---
prometheus::manage_prometheus_server: true

prometheus::version: '2.27.0'

prometheus::alerts:
  groups:
    - name: 'alert.rules'
      rules:
        - alert: 'InstanceDown'
          expr: 'up == 0'
          for: '1m'
          labels:
            severity: 'page'
          annotations:
            summary: 'Instance {{ .Labels.instance }} {{ .Value }} down'
            description: '{{ $labels.instance }} of job {{ $labels.job }} has been
              down for more than 1 minutes.'
        - alert: PrometheusJobMissing
          expr: absent(up{job="prometheus"})
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Prometheus job missing (instance {{ $labels.instance }})
            description: "A Prometheus job has disappeared\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: WindowsServerServiceStatus
          expr: windows_service_status{status="ok"} != 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Windows Server service Status (instance {{ $labels.instance }})
            description: "Windows Service state is not OK\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: WindowsServerDiskSpaceUsage
          expr: 100.0 - 100 * ((windows_logical_disk_free_bytes / 1024 / 1024 ) / ((windows_logical_disk_size_bytes{volume!=HarddiskVolume2}) / 1024 / 1024)) > 80
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Windows Server disk Space Usage (instance {{ $labels.instance }})
            description: "Disk usage is more than 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

prometheus::scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: '10s'
    scrape_timeout: '10s'
    static_configs:
      - targets:
          - 'prometheus.home.vm:9090'
          - '192.168.0.107:9182'
        labels:
          alias: 'Prometheus'
  - job_name: 'node'
    scrape_interval: '10s'
    scrape_timeout: '10s'
    static_configs:
      - targets:
          - 'prometheus.home.vm:9100'
          - '192.168.0.107:9182'
          - 'foreman.home.vm:9100'
          - 'grafana.home.vm:9100'
        labels:
          alias: 'none'
