---
classes:
  - "profile::default"
  - "profile::it::grafana"
profile::it::grafana::ldaphost_hide: ENC[PKCS7,]
profile::it::grafana::basedns_hide: 'ENC[PKCS7,]'
profile::it::grafana::binddns_hide: 'ENC[PKCS7,]'
network::interfaces_hash:
  eth0:
    type: Ethernet
    ipaddress: '192.168.0.47'
    netmask: '255.255.255.0'
    gateway: 192.168.0.1
    dns1: 192.168.0.1
    peerdns: 'yes'
    bootproto: 'none'
    onboot: 'yes'
