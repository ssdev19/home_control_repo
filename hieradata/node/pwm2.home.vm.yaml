---
classes:
  - profile::default
  - profile::it::tomcat3
  - profile::it::pwm2
profile::it::tomcat3::catalina_home: '/opt/tomcat'
profile::it::tomcat3::catalina_base: '/opt/tomcat'
profile::it::tomcat3::distribution: 'jre'
profile::it::tomcat3::version: 'tomcat-9/v9.0.56/bin/apache-tomcat-9.0.56'
# network::hostname: "%{facts.fqdn}"
network::interfaces_hash:
  eth0:
    type: Ethernet
    ipaddress: '192.168.0.53'
    netmask: '255.255.255.0'
    gateway: 192.168.0.1
    dns1: 192.168.0.1
    peerdns: 'yes'
    bootproto: 'none'
    onboot: 'yes'
