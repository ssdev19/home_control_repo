---
classes:
  - profile::default
  - profile::it::prometheus
profile::it::prometheus::slackuser_hide: ENC[PKCS7,]
profile::it::prometheus::slackapi_hide: ENC[PKCS7,]
profile::it::prometheus::cluster_hide: ENC[PKCS7,]
profile::it::prometheus::advertise_ip: 192.168.0.51:9093
profile::it::prometheus::server_ip: "%{serverip}"
# network::hostname: "%{facts.fqdn}"
network::interfaces_hash:
  eth0:
    ipaddress: '192.168.0.51'
    netmask: '255.255.255.0'
    gateway: '192.168.0.1'
    dns1: 192.168.0.1
    dns2: 8.8.8.8
    peerdns: 'yes'
    bootproto: none
    onboot: 'yes'
  eth1:
    ipaddress: 192.168.10.22
    netmask: 255.255.255.0
    dns1: 192.168.0.1
    peerdns: 'yes'
    bootproto: none
    onboot: 'yes'
