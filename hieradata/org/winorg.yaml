---
# passwords can be passed via org rather than the node
lookup_options:
  # "^profile::.*(password|token)$":
   profile::win::psswrd: # '^profile::.+::sensitive_\w+$':
     convert_to: 'Sensitive' 
   profile::win::secretcontent:
     convert_to: 'Sensitive'  
profile::win::psswrd: ENC[PKCS7,]
profile::win::secretcontent: 'ENC[PKCS7,]'
