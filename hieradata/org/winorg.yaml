lookup_options:
  '^profile::.+::sensitive_\w+$':
    convert_to: 'Sensitive'   

user {'bob':
    ensure     => present,
    name       => 'bob',
    groups     => ['Users'],
    password   => 'Test1pa$$rd',
    managehome => false,
 }
profile::win::psswrd: fakepwds

