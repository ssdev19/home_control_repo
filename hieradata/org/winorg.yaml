---
# passwords can be passed via org rather than the node
---
lookup_options:
  accounts::group_list:
    merge:
      strategy: "deep"
  accounts::user_list:
    merge:
      strategy: "deep"
  '^profile::.+::sensitive_\w+$':
    convert_to: 'Sensitive'   

profile::win::psswrd: fakepwds

accounts::user_list:
  shahram:
    groups:
      - "users"
    password: 'ENC[PKCS7,]'