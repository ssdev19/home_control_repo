---
lookup_options:
  accounts::group_list:
    merge:
      strategy: "deep"
  accounts::user_list:
    merge:
      strategy: "deep"
  profile::core::puppet_master::psswrd: # '^profile::.+::sensitive_\w+$':
    convert_to: 'Sensitive'   

timezone::timezone: "UTC"
ssh::server_options:
  Port: 22
  Protocol: 2
#  AddressFamily: "inet"
#   HostKey:
#     - "/etc/ssh/ssh_host_rsa_key"
#     - "/etc/ssh/ssh_host_ecdsa_key"
#     - "/etc/ssh/ssh_host_ed25519_key"
  SyslogFacility: "AUTH"
  LogLevel: "INFO"
  LoginGraceTime: 190
  PermitRootLogin: "yes"
  PubkeyAuthentication: "yes"
  HostbasedAuthentication: "no"
  IgnoreUserKnownHosts: "no"
  IgnoreRhosts: "no"
  PasswordAuthentication: "yes"
  ChallengeResponseAuthentication: "no"
  GSSAPIAuthentication: "yes"
  GSSAPICleanupCredentials: "yes"
  UsePAM: "yes"
  AllowTcpForwarding: "yes"
  X11Forwarding: "yes"
  X11UseLocalhost: "yes"
  PrintMotd: "no"
  TCPKeepAlive: "yes"
  ClientAliveInterval: 0
  ClientAliveCountMax: 3
  UseDNS: "yes"
  PermitTunnel: "no"
  Banner: "none" 
#   XAuthLocation: "/usr/bin/xauth"
#   Subsystem: "sftp /usr/libexec/openssh/sftp-server"
#   KerberosAuthentication: "no"
#   AuthorizedKeysCommand: "/usr/bin/sss_ssh_authorizedkeys"
#   AuthorizedKeysCommandUser: "nobody"
# ssh::client_options:
#   GlobalKnownHostsFile: "/var/lib/sss/pubconf/known_hosts"
#   PubkeyAuthentication: "yes"
#   ProxyCommand: "/usr/bin/sss_ssh_knownhostsproxy -p %p %h"


    
sudo::config_file_replace: false
sudo::purge: false

accounts::user_list:
  shahram:
    groups:
      - "wheel"
    sshkeys:
      - "ssh-rsa  rsa-key-20190116"
  # root:
#    password: "%{root_pw}"
    # sshkeys:
    #   - "ssh-rsa  rsa-key-20190116"
  # erwin:
  #   groups:
  #     - "wheel"
  #   password: 
  #   sshkeys:
  #     # foreman-proxy
  #     - "ssh-rsa  rsa-key-20190116"
  remove_users: &remove_user
    ensure: "absent"
    managehome: true
    purge_user_home: true
  erwin:
    <<: *remove_user

selinux::mode: "disabled"
firewall::ensure: "stopped"
puppet_agent::package_version: "7.5.0"
puppet_agent::collection: "puppet7"

yum::plugin::versionlock:
  # trigger `yum clean all`
  clean: true  


 
profile::core::puppet_master::psswrd: ENC[PKCS7,]
