---
lookup_options:
  accounts::group_list:
    merge:
      strategy: "deep"
  accounts::user_list:
    merge:
      strategy: "deep"
  profile::core::puppet_master::psswrd: # '^profile::.+::sensitive_\w+$':
    convert_to: 'Sensitive'   

timezone::timezone: "UTC"


    
sudo::config_file_replace: false
sudo::purge: false

accounts::user_list:
  shahram:
    groups:
      - "wheel"
    sshkeys:
      - "ssh-rsa  rsa-key-20190116"
  # root:
#    password: "%{root_pw}"
    # sshkeys:
    #   - "ssh-rsa  rsa-key-20190116"
  # erwin:
  #   groups:
  #     - "wheel"
  #   password: 
  #   sshkeys:
  #     # foreman-proxy
  #     - "ssh-rsa  rsa-key-20190116"
  remove_users: &remove_user
    ensure: "absent"
    managehome: true
    purge_user_home: true
  # erwin:
  #   <<: *remove_user

selinux::mode: "disabled"
firewall::ensure: "stopped"
puppet_agent::package_version: "7.5.0"
puppet_agent::collection: "puppet7"

yum::plugin::versionlock:
  # trigger `yum clean all`
  clean: true  


 
profile::core::puppet_master::psswrd: 'ENC[PKCS7,]'
