# SSL Certificate variables
country: US
state: Arizona
locality: "Tucson"
organization: "LSST"
division: IT
canonical_name: "graylog2.home.vm" 
server_ip_address: 192.168.0.43 
alternative_dns_1: "graylog2.home.vm"

certificate_duration: 3650
ssl_key_algorithm: "rsa:2048"
ssl_passout_phrase: "pass:secret"
ssl_key_passout_phrase: "pass:albatroz"
